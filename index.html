<style>

          border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;

  .bar { display: flex; gap: 12px; margin: 22px 0 18px; align-items: center; flex-wrap: wrap; }

  .chip {

    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none;

  .search { flex: 1; min-width: 200px; max-width: 340px; margin-left: auto; }
  .search input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 14px; border-radius: 10px; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--acc); }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px; margin-top: 8px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    display: flex; flex-direction: column; gap: 9px; transition: transform .12s, border-color .12s;
    position: relative;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--acc); }
  .card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card h3 { font-size: 17px; }
  .card .stars { color: var(--star); font-size: 12.5px; white-space: nowrap; }
  .card .desc { color: var(--dim); font-size: 13px; line-height: 1.65; flex: 1; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { background: var(--chip); border: 1px solid var(--border); color: var(--acc);
         font-size: 11.5px; padding: 2px 9px; border-radius: 999px; }
  .tag.warn { color: var(--star); }
  .card .actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn { flex: 1; text-align: center; text-decoration: none; padding: 9px 0; border-radius: 9px;
         font-size: 14px; font-weight: 600; transition: filter .12s; }
  .btn.play { background: var(--acc2); color: #06130a; }
  .btn.play:hover { filter: brightness(1.12); }
  .btn.gh { flex: 0 0 42px; background: var(--chip); border: 1px solid var(--border);
            color: var(--dim); display: flex; align-items: center; justify-content: center; }
  .btn.gh:hover { color: var(--text); border-color: var(--dim); }
  footer { margin-top: 40px; color: var(--dim); font-size: 13px; line-height: 1.9;
           border-top: 1px solid var(--border); padding-top: 20px; }
  footer code { background: var(--chip); padding: 1px 7px; border-radius: 6px; font-size: 12.5px; }
  footer a { color: var(--acc); }
  .count { color: var(--dim); font-size: 13px; }
  .note { font-size: 12px; color: var(--star); opacity: .9; }
  @media (max-width: 640px) { header h1 { font-size: 24px; } .search { max-width: none; } }
</style>

const STATS = { starsZh: "17.2万", starsEn: "171.5k" };

const I18N = {
  zh: {
    h1: '🎮 离线小游戏合集 <span class="em">GitHub 高星精选 194</span>',
    sub: '全部游戏已下载到本地、可离线运行。由 3652 个候选仓库经 8 维度评分与四轮论证精选而来，品类覆盖街机、解谜、竞速、沙盒、放置、棋类、编程学习等。<b>双击「启动合集.bat」即可游玩。</b>',
    statGames: '款精选游戏', statStarsLbl: '累计 GitHub Stars', statSize: '本地体积', statGenres: '个品类',
    search: '🔍 搜索游戏名 / 品类 / 介绍…', all: '全部', play: '▶ 开始游戏', gh: 'GitHub 原仓库',
    note: '注', footer: '<b>使用说明</b>：必须通过本地服务器游玩（部分游戏按 HTTP 方式加载资源）。双击 <code>启动合集.bat</code>（Windows）或运行 <code>python server.py</code>，浏览器打开 <code>http://127.0.0.1:8137</code>。<br><b>关于版权</b>：所有游戏版权归原作者所有，本合集仅作本地学习与娱乐用途；卡片右上角可跳转其 GitHub 原仓库。完整清单见 <a href="games/manifest.json">manifest.json</a>，中文说明见 <a href="README.md">README.md</a>。'
  },
  en: {
    h1: '🎮 Offline Mini Games <span class="em">194 GitHub Favorites</span>',
    sub: 'Every game is downloaded locally and runs offline. Curated from 3,652 candidate repos through an 8-dimension rubric and four review rounds — arcade, puzzle, racing, sandbox, idle, board and coding games included. <b>Double-click “启动合集.bat” to play.</b>',
    statGames: 'curated games', statStarsLbl: 'GitHub stars total', statSize: 'local size', statGenres: 'genres',
    search: '🔍 Search name / genre / description…', all: 'All', play: '▶ PLAY', gh: 'GitHub repo',
    note: 'Note', footer: '<b>How to play</b>: the collection must be served over HTTP (some games load assets via XHR). Double-click <code>启动合集.bat</code> (Windows) or run <code>python server.py</code>, then open <code>http://127.0.0.1:8137</code>.<br><b>License</b>: all games belong to their original authors; this collection is for local learning and personal fun. In any game, the <b>中 | EN</b> toggle at the bottom-right switches the UI language of that game (including canvas-drawn text and dialogs); switching off restores the original English.<br> <a href="games/manifest.json">manifest.json</a> · English docs: <a href="README_EN.md">README_EN.md</a>.'
  }
};

const fmtStars = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/, "") + "k" : n;
let lang = localStorage.getItem("games_lang") || "zh";
let genreKey = I18N[lang].all;   // 用当前语言的品类名作键
let q = "";

const gname = g => lang === "zh" ? g.zh : (g.name_en || g.zh);
const gdesc = g => lang === "zh" ? g.desc : (g.desc_en || g.desc);
const ggenre = g => lang === "zh" ? g.genre : (g.genre_en || g.genre);
const gnote = g => lang === "zh" ? (g.note || "") : (g.note_en || g.note || "");
const allKey = () => I18N[lang].all;
const genreList = () => [allKey(), ...new Set(GAMES.map(ggenre))];

function applyStatic() {
  const t = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("h1").innerHTML = t.h1;
  document.getElementById("sub").innerHTML = t.sub;
  document.getElementById("statGames").textContent = t.statGames;
  document.getElementById("statStars").textContent = lang === "zh" ? STATS.starsZh : STATS.starsEn;
  document.getElementById("statStarsLbl").textContent = t.statStarsLbl;
  document.getElementById("statSize").textContent = t.statSize;
  document.getElementById("statGenres").textContent = t.statGenres;
  document.getElementById("q").placeholder = t.search;
  document.getElementById("footer").innerHTML = t.footer;
}

function render() {
  const t = I18N[lang];
  const licName = l => l === "见仓库" && lang === "en" ? "see repo" : l;
  const list = GAMES.filter(g =>
    (genreKey === allKey() || ggenre(g) === genreKey) &&
    (!q || (gname(g) + " " + gdesc(g) + " " + ggenre(g) + " " + g.repo).toLowerCase().includes(q.toLowerCase()))
  );
  document.getElementById("count").textContent = list.length + " / " + GAMES.length;
  document.getElementById("grid").innerHTML = list.map(g => {
    const note = gnote(g);
    return `
    <div class="card">
      <div class="top"><h3>${gname(g)}</h3><span class="stars">★ ${fmtStars(g.stars)}</span></div>
      <div class="desc">${gdesc(g)}</div>
      <div class="meta">
        <span class="tag">${ggenre(g)}</span>
        <span class="tag">${g.size_mb} MB</span>
        <span class="tag">${licName(g.license)}</span>
        ${note ? `<span class="tag warn" title="${note}">${t.note}</span>` : ""}
      </div>
      ${note ? `<div class="note">${note}</div>` : ""}
      <div class="actions">
        <a class="btn play" href="${g.play}" target="_blank" rel="noopener">${t.play}</a>
        <a class="btn gh" href="${g.url}" target="_blank" rel="noopener" title="${t.gh}">⌂</a>
      </div>
    </div>`;
  }).join("");
}

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = genreList().map(name =>
    `<span class="chip ${name === genreKey ? "on" : ""}" data-g="${name}">${name}</span>`).join("");
  box.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    genreKey = c.dataset.g; renderChips(); render();
  });
}

document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
document.getElementById("langBtn").addEventListener("click", () => {
  const idx = genreKey === allKey() ? 0 : genreList().indexOf(genreKey);
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("games_lang", lang);
  const names = genreList();
  genreKey = names[Math.min(idx, names.length - 1)] || allKey();
  applyStatic(); renderChips(); render();
});

applyStatic(); renderChips(); render();
</script>
