<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INKWAVE Lobby Set Lab</title>
<style>
  @font-face { font-family: 'Rubik'; src: url('../assets/fonts/Rubik-latin.woff2') format('woff2'); font-weight: 400 900; }
  :root { --panel: rgba(16, 18, 24, 0.78); --line: rgba(255, 255, 255, 0.1); --text: #e9ecf1; --muted: #9aa3b2; --accent: #7cc4ff; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 500 12px/1.35 Rubik, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel {
    position: fixed; top: 12px; right: 12px; width: 236px; max-height: calc(100% - 24px); overflow: auto; z-index: 5;
    background: var(--panel); backdrop-filter: blur(14px) saturate(140%); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  #panel.hidden { display: none; }
  h1 { margin: 0 0 2px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  h2 { margin: 10px 0 6px; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--text);
    font: 600 11px Rubik, system-ui, sans-serif; padding: 5px 8px; border-radius: 7px; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.11); }
  button.on { border-color: var(--accent); background: rgba(124, 196, 255, 0.16); }
  #stats { margin-top: 10px; font: 500 11px ui-monospace, SFMono-Regular, monospace; color: var(--muted); white-space: pre; }
  /* stand-ins for the lobby UI: the showcase composes the set for a frame whose left ~28% and bottom ~13% are covered */
  #uimock { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  #uimock .l { position: absolute; left: 0; top: 0; bottom: 0; width: 28%; background: rgba(12, 14, 24, 0.55); backdrop-filter: blur(6px); border-right: 1px solid rgba(255,255,255,0.08); }
  #uimock .b { position: absolute; left: 28%; right: 0; bottom: 0; height: 13%; background: rgba(12, 14, 24, 0.45); backdrop-filter: blur(6px); border-top: 1px solid rgba(255,255,255,0.08); }
  #uimock.hub .l { width: 55%; }
  #uimock.hub .b { display: none; }
  #uimock.off { display: none; }
  .plate { font: 800 12px Rubik, system-ui, sans-serif; color: #fff; background: rgba(12, 14, 26, 0.72); padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 2px solid var(--c, #fff); }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/jsm/"}}</script>
</head>
<body>
<div id="uimock"><div class="l"></div><div class="b"></div></div>
<div id="labels"></div>
<div id="panel">
  <h1>INKWAVE LOBBY SET</h1>
  <div class="sub">H panel, U UI mock, P plates, K kids, N lanes, space pause.</div>
  <h2>Camera</h2>
  <div class="row" id="cams"></div>
  <h2>Teams</h2>
  <div class="row" id="teams"></div>
  <h2>Quality</h2>
  <div class="row" id="quality"></div>
  <div id="stats"></div>
</div>
<script type="module" src="./lobbyset-lab.js"></script>
</body>
</html>
