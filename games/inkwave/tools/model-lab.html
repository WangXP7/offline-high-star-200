<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>INKWAVE — Model Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @font-face { font-family: 'Rubik'; src: url('../assets/fonts/Rubik-latin.woff2') format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Titan One'; src: url('../assets/fonts/TitanOne-latin.woff2') format('woff2'); }
  :root { --bg: rgba(18, 20, 28, 0.84); --line: rgba(255,255,255,0.09); --fg: #eef1f6; --dim: #9aa3b2; --acc: #ff8a14; }
  html, body { margin: 0; height: 100%; background: #20232b; overflow: hidden; font-family: 'Rubik', system-ui, sans-serif; color: var(--fg); }
  canvas { display: block; }
  #panel { position: fixed; left: 12px; top: 12px; bottom: 12px; width: 300px; overflow-y: auto; background: var(--bg); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 16px; box-sizing: border-box; font-size: 12px; }
  #panel h1 { font-family: 'Titan One', sans-serif; font-weight: 400; font-size: 20px; margin: 2px 2px 10px; letter-spacing: 0.5px; }
  #panel h1 span { color: var(--acc); }
  .sec { border-top: 1px solid var(--line); padding: 8px 0 6px; }
  .sec > .t { font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--dim); margin: 0 2px 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; font-weight: 600; font-size: 11.5px; color: var(--fg); background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.14); }
  button.on { background: var(--acc); border-color: transparent; color: #16171c; }
  .sw { width: 22px; height: 22px; padding: 0; border-radius: 6px; display: inline-flex; overflow: hidden; }
  .sw i { flex: 1; height: 100%; }
  #hud { position: fixed; right: 12px; top: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--dim); line-height: 1.5; min-width: 190px; white-space: pre; }
  #hud b { color: var(--fg); }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: rgba(255,255,255,0.86); text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    padding: 6px 8px; text-transform: uppercase; }
  .hide #panel, .hide #hud { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<div id="panel"></div>
<div id="hud"></div>
<script type="module" src="./model-lab.js"></script>
</body>
</html>
