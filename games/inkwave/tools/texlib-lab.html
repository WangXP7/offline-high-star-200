<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INKWAVE Texture Lab</title>
<style>
  @font-face { font-family: 'Rubik'; src: url('../assets/fonts/Rubik-latin.woff2') format('woff2'); font-weight: 400 900; }
  :root { --panel: rgba(16, 18, 24, 0.78); --line: rgba(255, 255, 255, 0.09); --text: #e9ecf1; --muted: #9aa3b2; --accent: #7cc4ff; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 500 12px/1.35 Rubik, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel {
    position: fixed; top: 12px; right: 12px; width: 250px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(14px) saturate(140%); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  #panel.hidden, #labels.hidden, #tag.hidden { display: none; }
  h1 { margin: 0 0 2px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  h2 { margin: 12px 0 6px; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--text);
    font: 600 11px Rubik, system-ui, sans-serif; padding: 5px 8px; border-radius: 7px; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.11); }
  button.on { border-color: var(--accent); background: rgba(124, 196, 255, 0.16); }
  #stats { margin-top: 10px; font: 500 11px ui-monospace, SFMono-Regular, monospace; color: var(--muted); white-space: pre; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); font: 700 11px Rubik, system-ui, sans-serif; color: #1d2230;
    background: rgba(255, 255, 255, 0.78); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  #tag { position: fixed; left: 12px; bottom: 10px; font: 700 12px Rubik, system-ui, sans-serif; color: #fff;
    background: rgba(12, 14, 20, 0.6); padding: 4px 9px; border-radius: 8px; }
</style>

</head>

<div id="tag"></div>
<div id="panel">
  <h1>INKWAVE TEXTURE LAB</h1>
  <div class="sub">src/world/texlib.js · H hides panel</div>
  <h2>View</h2>
  <div class="row" id="views"></div>
  <h2>Material</h2>
  <div class="row" id="mats"></div>
  <h2>Options</h2>
  <div class="row" id="opts"></div>
  <div id="stats"></div>
</div>
<script type="module" src="./texlib-lab.js"></script>
</body>
</html>
