<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>INKWAVE FX Lab</title>
<style>
  @font-face { font-family: 'Rubik'; src: url('../assets/fonts/Rubik-latin.woff2') format('woff2'); font-weight: 400 900; }
  :root {
    --panel: rgba(16, 18, 24, 0.78); --line: rgba(255, 255, 255, 0.09); --text: #e9ecf1; --muted: #9aa3b2;
    --a: #ff8a14; --b: #2f5bff; --accent: #7cc4ff;
  }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 500 12px/1.35 Rubik, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel {
    position: fixed; top: 12px; left: 12px; width: 272px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(14px) saturate(140%); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  #panel.hidden { display: none; }
  h1 { margin: 0 0 2px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  h2 { margin: 12px 0 6px; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--text);
    font: 600 11px Rubik, system-ui, sans-serif; padding: 5px 8px; border-radius: 7px; cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  button:hover { background: rgba(255, 255, 255, 0.11); }
  button.on { border-color: var(--accent); background: rgba(124, 196, 255, 0.16); }
  .fxgrid { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 6px; align-items: center; }
  .fxgrid span { color: var(--text); }
  .fxgrid kbd { color: var(--muted); font: 600 10px ui-monospace, monospace; margin-left: 4px; }
  .sw { width: 30px; padding: 5px 0; }
  .sw.a { background: color-mix(in srgb, var(--a) 70%, transparent); border-color: var(--a); }
  .sw.b { background: color-mix(in srgb, var(--b) 75%, transparent); border-color: var(--b); }
  #stats { margin-top: 10px; font: 500 11px ui-monospace, SFMono-Regular, monospace; color: var(--muted); white-space: pre; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: rgba(255, 255, 255, 0.55); font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/jsm/"}}</script>
</head>
<body>
<div id="panel">
  <h1>INKWAVE FX LAB</h1>
  <div class="sub">Environment + ink particles. H hides this panel.</div>
  <h2>Theme</h2>
  <div class="row" id="themes"></div>
  <h2>Camera</h2>
  <div class="row" id="cams"></div>
  <h2>Effects</h2>
  <div class="fxgrid" id="fx"></div>
  <h2>Time</h2>
  <div class="row" id="time"></div>
  <div id="stats"></div>
</div>
<div id="hint">drag orbit · right-drag pan · wheel zoom · 1–9 fire (shift = blue) · T theme · C camera · space pause</div>
<script type="module" src="./fx-lab.js"></script>
</body>
</html>
