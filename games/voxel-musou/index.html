  #prologue .pl-stamp em { font: 600 1.6rem/1 var(--sans); font-style: normal; letter-spacing: .9em; margin-right: -.9em; color: #4a3020; opacity: 0; }
  #prologue.stamped .pl-stamp em { opacity: .85; transition: opacity .8s 1.4s; }

  /* result: ink wash over the frozen field; brush 勝利 / 敗北, counted tallies, the rank stamp, the epilogue */
  #result:not([hidden]) { display: flex; }
  #result { align-items: center; justify-content: flex-start; padding-bottom: 7rem; box-sizing: border-box;
    background: linear-gradient(90deg, rgba(10,6,4,.95) 0, rgba(10,6,4,.88) 52%, rgba(10,6,4,.5) 80%, rgba(10,6,4,.35)); }
  /* officer key art (ctx.art) large on the right, fading into the ink wash (ui lane) */
  #result.art::before { content: ""; position: absolute; inset: 0; background: var(--art) center / cover no-repeat; transform-origin: 74% 42%;
    -webkit-mask: linear-gradient(90deg, transparent 44%, #000 66%); mask: linear-gradient(90deg, transparent 44%, #000 66%);
    animation: rsArt 1.2s cubic-bezier(.2,0,.2,1) both .2s; }
  #result.art.lose::before { filter: grayscale(.75) brightness(.7) sepia(.2); }
  @keyframes rsArt { from { opacity: 0; transform: scale(1.12) translateX(3%); } to { transform: scale(1.06); } }
  #result .rs { position: relative; margin-left: 8vw; width: min(82rem, 86vw); display: flex; flex-direction: column; gap: 1.2rem; }
  #result .rs-head { display: flex; align-items: center; gap: 2.6rem; animation: rsIn .6s both; }
  #result .rs-badge { position: relative; flex: none; width: 10rem; height: 10rem; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #3c6f72, #16262a 70%); border: .32rem solid #d9d2c6;
    box-shadow: 0 0 0 .2rem #1a1210, 0 0 0 .36rem #b8893a, 0 .4rem 1rem rgba(0,0,0,.6); }
  #result .rs-badge canvas { position: absolute; left: 1rem; bottom: -.3rem; width: 8rem; height: 8rem; image-rendering: pixelated; }
  #result .rs-head small { display: block; font: 600 1.2rem/1 var(--sans); letter-spacing: .35em; color: #cdbb9c; }
  #result .rs-head h2 { margin: .5rem 0 .2rem; font: 700 8rem/1 var(--brush); letter-spacing: 1.6rem; color: #ffe3a0;
    text-shadow: 0 0 .1rem #000, .35rem .45rem 0 rgba(0,0,0,.6), 0 0 3rem rgba(255,170,60,.35); animation: rsStamp .55s cubic-bezier(.2,.8,.3,1) both .1s; }
  #result .rs-head em { font: 600 1.6rem/1 var(--sans); font-style: normal; letter-spacing: 1.2em; color: #f2c14e; }
  #result.lose .rs-head h2 { color: #c9b8ae; text-shadow: 0 0 .1rem #000, .35rem .45rem 0 rgba(0,0,0,.6), 0 0 3rem rgba(200,40,20,.35); }
  #result.lose .rs-head em { color: #d8715e; }
  #result.lose .rs-badge { filter: grayscale(.8) brightness(.8); }
  #result .rs-body { display: flex; align-items: flex-start; gap: 2.4rem; }
  #result .rs-stats { border-collapse: collapse; min-width: 46rem; border-left: .3rem solid #b3261e;
    background: linear-gradient(90deg, rgba(0,0,0,.4), rgba(0,0,0,0)); }
  #result .rs-stats tr { border-bottom: .1rem solid rgba(214,184,130,.16); animation: rsIn .45s both; animation-delay: calc(.55s + var(--i) * .35s); }
  #result .rs-stats th { padding: .6rem 2rem; text-align: left; font: 700 2.3rem/1 var(--kai); color: #f2c14e; white-space: nowrap; }
  #result .rs-stats th small { font: 600 1.05rem/1 var(--sans); letter-spacing: .25em; color: #cdbb9c; margin-left: 1rem; }
  #result .rs-stats td { padding: .6rem 2rem; min-width: 12rem; text-align: right; font: 700 3.2rem/1 var(--brush); color: #f7f1e8;
    font-variant-numeric: tabular-nums; text-shadow: .2rem .3rem 0 rgba(0,0,0,.55); }
  /* records (result.js): a tally that beat the officer's best — a gold 新紀錄 tag over the old value, struck through */
  #result .rs-stats td.rs-new { min-width: 9rem; padding-left: 0; text-align: left; font: 600 1.2rem/1 var(--sans); text-shadow: none; }
  #result .rs-new b { display: inline-block; padding: .3rem .6rem; font: 700 1.5rem/1 var(--kai); color: #1a120d; border-radius: .2rem; transform: rotate(-4deg);
    background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); animation: rsStamp .4s cubic-bezier(.3,1.5,.5,1) both 2.2s; }
  #result .rs-new small { display: block; margin-top: .4rem; color: #cdbb9c; text-decoration: line-through; }
  #result .rs-rank em { font: 700 1.5rem/1 var(--kai); font-style: normal; color: #ffe3a0; }
  #result .rs-rank { display: flex; flex-direction: column; align-items: center; gap: .6rem; margin-top: -1.2rem; transform: rotate(-8deg);
    animation: rsStamp .4s cubic-bezier(.3,1.5,.5,1) both 2.2s; }
  #result .rs-rank span { font: 700 2.2rem/1 var(--kai); color: #efe3cf; }
  #result .rs-rank span small { font: 600 1rem/1 var(--sans); letter-spacing: .3em; margin-left: .6rem; opacity: .75; }
  #result .rs-rank b { display: grid; place-items: center; width: 14rem; height: 14rem; border-radius: 50%; font: 700 11rem/1 var(--brush);
    color: #f7f1e8; background: radial-gradient(circle, rgba(0,0,0,.35) 52%, transparent 53%);
    box-shadow: inset 0 0 0 .9rem var(--rc, #b3261e), inset 0 0 0 1.2rem rgba(0,0,0,.4), 0 0 2.4rem var(--rg, rgba(179,38,30,.4));
    text-shadow: .3rem .4rem 0 rgba(0,0,0,.6), 0 0 1.6rem var(--rg, rgba(179,38,30,.4)); }
  #result .rs-rank.rS b { --rc: #e2b040; --rg: rgba(255,200,80,.65); color: #fff0b8; }
  #result .rs-rank.rA b { --rc: #b3261e; }
  #result .rs-rank.rB b { --rc: #2f8a84; --rg: rgba(63,184,176,.35); }
  #result .rs-rank.rC b { --rc: #7a6a5a; --rg: rgba(0,0,0,.3); color: #cdbb9c; }
  /* the battle's difficulty: a small vermilion-edged tag after VICTORY / DEFEAT; the 修羅 unlock line stamps in after the rank */
  #result .rs-dif { display: inline-block; margin-left: 2rem; padding: .35rem .8rem; vertical-align: .2rem; font: 700 1.8rem/1 var(--kai); color: #efe3cf;
    border: .14rem solid #b3261e; border-radius: .3rem; background: rgba(179,38,30,.18); }
  #result .rs-dif small { margin-left: .6rem; font: 600 1.05rem/1 var(--sans); letter-spacing: .25em; text-transform: uppercase; color: #cdbb9c; }
  /* announcements share one compact block: three unlocks still leave room for the epilogue and the prompts at 720p */
  #result .rs-unlocks { display: grid; gap: .6rem; }
  #result .rs-unlock { margin: 0; font: 700 2.1rem/1.2 var(--brush); letter-spacing: .3rem; color: #ffe3a0;
    text-shadow: 0 0 1.4rem rgba(255,190,80,.45), .2rem .3rem 0 rgba(0,0,0,.6); animation: rsStamp .4s cubic-bezier(.3,1.5,.5,1) both 2.5s; }
  #result .rs-unlock small { margin-left: 1.2rem; font: 600 1.2rem/1 var(--sans); letter-spacing: .25em; text-transform: uppercase; color: #f2c14e; text-shadow: none; }
  #result .rs-epi { max-width: 76rem; animation: rsIn .8s both 2.6s; }
  #result.lose .rs-epi { animation-delay: 1.9s; }
  #result .rs-epi p { margin: 0 0 .6rem; font: 700 1.9rem/1.4 var(--kai); color: #efe3cf; }
  #result .rs-epi small { display: block; font: 500 1.25rem/1.4 var(--sans); letter-spacing: .02em; color: #cdbb9c; }
  #result .rs-btns { display: flex; gap: 1.6rem; animation: rsIn .5s both 3s; }
  #result.lose .rs-btns { animation-delay: 2.1s; }
  #result .rs-btns button { padding: 1.1rem 3.6rem; cursor: pointer; border: 0; border-radius: .4rem; font: 700 2.8rem/1 var(--brush); letter-spacing: .5rem;
    color: #1a120d; background: linear-gradient(#ffe7a3, #f2c14e 55%, #c98a22); box-shadow: 0 0 0 .15rem #5a3a10, 0 .5rem 1.6rem rgba(0,0,0,.5); }
  #result .rs-btns button.sub { color: #f4ead8; background: rgba(0,0,0,.45); box-shadow: 0 0 0 .15rem rgba(239,227,207,.5); }
  #result .rs-btns button small { font: 600 1.3rem/1 var(--sans); letter-spacing: .3em; margin-left: 1rem; }
  #result .rs-btns button:hover, #result .rs-btns button:focus-visible { filter: brightness(1.12); outline: .2rem solid #ffe7a3; outline-offset: .35rem; }
  @keyframes rsIn { from { opacity: 0; transform: translateX(-2rem); } }
  @keyframes rsStamp { from { opacity: 0; transform: scale(1.7) rotate(-6deg); } }

  /* reduced motion: every CSS animation / transition lands at once; the ink-wait ring stands still, the prologue doesn't lift */
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    .ink-wait svg { animation: none; }
    #prologue.out :is(.pl-paper, .pl-rod) { scale: none; }
  }
</style>
</head>
<body class="inkhold">
<canvas id="c"></canvas>
<div id="hud" hidden></div>
<div id="menu" hidden>
  <div class="t">趙雲<i>常山</i></div>
  <div class="en" style="--d:.04s">VOXEL MUSOU</div>
  <div class="sub" style="--d:.08s">戰局暫停<small>Battle paused</small></div>
  <button id="go" style="--d:.14s">繼續<small>Resume</small></button>
  <button id="quit" style="--d:.18s">撤退<small>Quit to title</small></button>
  <div class="hint" style="--d:.22s"><kbd>↑</kbd><kbd>↓</kbd> 選擇 Select · <kbd>Enter</kbd><kbd class="pad">A</kbd> 決定 Confirm · <kbd>Esc</kbd><kbd class="pad">B</kbd> 繼續 Resume</div>
</div>
<!-- flow screens (main.js). ui lane: #title #select · story lane: #prologue #result -->
<div id="title" class="scr" hidden></div>
<div id="select" class="scr" hidden></div>
<div id="loading" class="scr" hidden></div>
<div id="prologue" class="scr" hidden></div>
<div id="result" class="scr" hidden></div>
<div id="ink" class="boot"><div class="ink-wait"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke-width="2.6" stroke-dasharray="120 163"/>
  <circle cx="50" cy="50" r="41" stroke-width="1.2" stroke-dasharray="36 222" stroke-dashoffset="-150" opacity=".6"/></svg><i>無雙</i></div></div>
<script>
  // boot failure (a module that 404s or won't link, e.g. a stale cached copy next to fresh ones): the page opens under the
  // ink and only main.js lifts it, so say what happened instead of turning the seal forever
  addEventListener('error', () => {
    const w = document.querySelector('#ink.boot .ink-wait');
    if (w) w.innerHTML = '<p>載入失敗<small>Failed to load · force-reload (Ctrl/Cmd+Shift+R)</small></p>';
  }, true);
</script>
<script type="module" src="./src/main.js"></script>
<script src="../__i18n.js"></script></body>
</html>
